name: Déploiement EX2

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Envoi des fichiers vers EX2 (FTP)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.EX2_FTP_HOST }}
          username: ${{ secrets.EX2_FTP_USER }}
          password: ${{ secrets.EX2_FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./
          server-dir: ${{ secrets.EX2_FTP_DIR }}
          # Pas de nettoyage : les fichiers présents uniquement sur le serveur (config.php, uploads) sont conservés.
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            config.php
            README.md
